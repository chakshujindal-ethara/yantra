<text x="860.0" y="337.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">addon</text>
<rect x="520" y="266" width="200" height="96" rx="10" fill="#FFFFFF" stroke="#4B4B57" stroke-width="1.5"/>
<text x="620.0" y="277.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#030213" text-anchor="middle" dominant-baseline="middle">4. Port at renewal</text>
<text x="620.0" y="296.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">units imported with a dry run;</text>
<text x="620.0" y="310.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">reviewers on the bench; the</text>
<text x="620.0" y="323.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">addon retired; an ending</text>
<text x="620.0" y="337.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">project is archived, not</text>
<text x="620.0" y="351.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">ported</text>
<rect x="280" y="266" width="200" height="96" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="380.0" y="291.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#030213" text-anchor="middle" dominant-baseline="middle">Gate</text>
