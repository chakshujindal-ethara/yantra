<text x="860.0" y="171.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">old projects untouched</text>
<rect x="1000" y="100" width="200" height="96" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
