<rect x="0" y="0" width="1240" height="402" rx="12" fill="#FFFFFF" stroke="#E0E0E4"/>
<text x="40.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#030213" text-anchor="start" dominant-baseline="middle">Moving the current platform over: the strangler path</text>
<text x="40.0" y="50.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#717182" text-anchor="start" dominant-baseline="middle">Nothing live is rewritten. A project moves at its own renewal; a project that is ending never moves.</text>
<rect x="40" y="100" width="200" height="96" rx="48.0" fill="#030213" stroke="#030213" stroke-width="1.5"/>
<text x="140.0" y="125.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Today</text>
<text x="140.0" y="144.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">113 addons, about 25 task</text>
<text x="140.0" y="157.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">apps, 29 dashboards on the</text>
<text x="140.0" y="171.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">current platform</text>
<rect x="280" y="100" width="200" height="96" rx="10" fill="#FFFFFF" stroke="#4B4B57" stroke-width="1.5"/>
<text x="380.0" y="118.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#030213" text-anchor="middle" dominant-baseline="middle">1. Connect</text>
<text x="380.0" y="137.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">Keycloak in front of both; one</text>
<text x="380.0" y="150.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">person id; an outbox addon</text>
<text x="380.0" y="164.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">emits events from existing</text>
<text x="380.0" y="178.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">projects</text>
<rect x="520" y="100" width="200" height="96" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
<text x="620.0" y="125.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#030213" text-anchor="middle" dominant-baseline="middle">Gate</text>
<text x="620.0" y="144.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">a current project&#x27;s accept</text>
<text x="620.0" y="157.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">events on the bus within a</text>
<text x="620.0" y="171.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">minute; no screen changed</text>
<rect x="760" y="100" width="200" height="96" rx="10" fill="#FFFFFF" stroke="#4B4B57" stroke-width="1.5"/>
<text x="860.0" y="125.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#030213" text-anchor="middle" dominant-baseline="middle">2. Read models first</text>
<text x="860.0" y="144.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#717182" text-anchor="middle" dominant-baseline="middle">Performance views and the</text>
