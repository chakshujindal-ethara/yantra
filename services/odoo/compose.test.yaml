# Throwaway rig for the Odoo test suites (Yantra's bridges and the vendored Assessment v2). Never shares anything
# with deployment/local.
#   docker compose -f services/odoo/compose.test.yaml up -d --build
#   docker compose -f services/odoo/compose.test.yaml run --rm odoo odoo -d yantra_odoo_test \
#       -i yantra_bridge,yantra_assess_bridge --test-enable --test-tags=/yantra_bridge,/yantra_assess_bridge \
#       --stop-after-init
#   # the vendored suites, on every vendor bump (about 3,000 tests):
#   docker compose -f services/odoo/compose.test.yaml run --rm odoo odoo -d v2_test \
#       -i assessments_be_v2,api_auth_gateway --test-enable --test-tags=/assessments_be_v2,/api_auth_gateway \
#       --stop-after-init
#   docker compose -f services/odoo/compose.test.yaml down -v
name: yantra-odoo-test

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  odoo:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8169:8069"
    volumes:
      - ./addons:/mnt/yantra-addons:ro
