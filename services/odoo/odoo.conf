[options]
; Database host/user/password are NOT set here on purpose: the official image's entrypoint
; reads HOST, PORT, USER and PASSWORD from the environment and passes them as --db_* flags.
; The vendored addons (Assessment v2 and its token gateway) sit beside Yantra's own.
addons_path = /mnt/yantra-addons,/mnt/vendor-addons
data_dir = /var/lib/odoo
list_db = False
admin_passwd = yantra-local-master   ; the local rig's database-manager password; production sets its own
proxy_mode = True
; Assessment v2 runs 13 crons, most every minute (scoring, invitations, expiry, generation): threaded Odoo with
; two cron threads, as Ethara runs it (workers = 0).
workers = 0
max_cron_threads = 2
db_maxconn = 48
limit_time_cpu = 120
limit_time_real = 240
limit_time_real_cron = 900
log_level = info
