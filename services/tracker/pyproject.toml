[project]
name = "yantra-tracker"
version = "0.1.0"
description = "tracker: activity sessions while a claim is live, weekly hour caps, anomaly flags feeding payout holds."
requires-python = ">=3.12,<3.13"
dependencies = [
  "yantra-common",
  "yantra-contracts",
  "sqlalchemy==2.1.8",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "fastapi==0.115.5",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yantra_tracker"]
