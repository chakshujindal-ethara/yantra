server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # COMPRESSION. Orthogonal to the caching rules below - gzip changes how many
    # bytes cross the wire, `Cache-Control` changes whether they cross it at all
    # - so this does not disturb any of the freshness reasoning documented
    # further down.
    #
    # Measured on this bundle: 10.7MB -> ~4.1MB, driven by the two files that
    # dominate a cold load (main.dart.js ~3.9MB and canvaskit.wasm ~7.2MB, both
    # highly compressible). At a 1,000-candidate cohort all starting inside a
    # 10-minute window that is the difference between ~171 Mbit/s and
    # ~66 Mbit/s at the origin, and 53.5GB vs 20.5GB across the cohort. It is
    # also the reason a CDN is an optimisation rather than a prerequisite.
    #
    # `gzip_static off` on purpose: nothing in the build produces .gz siblings,
    # and pointing nginx at files that do not exist just adds a failed stat to
    # every request.
    #
    # NOT wasm-by-default: nginx's stock gzip_types has no wasm entry, so
    # canvaskit.wasm - the single largest asset - would otherwise ship
    # uncompressed. That omission is most of the win, so it is listed
    # explicitly.
    gzip on;
    gzip_vary on;
    gzip_static off;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        application/wasm
        text/css
        text/plain
        image/svg+xml
        font/ttf
        font/otf;

    # Main app routing (handles Flutter SPA)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin *;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Static payload.
    #
    # `no-cache` means "cache it, but revalidate before reuse" - NOT "do not
    # cache". nginx answers an unchanged file with a 304 off its ETag, so the
    # 6.9MB canvaskit.wasm stays off the wire on a repeat load while a file that
    # HAS changed is always picked up.
    #
    # This replaced `public, max-age=31536000, immutable`, which is wrong for a
    # Flutter web bundle: Flutter content-hashes NOTHING. main.dart.js,
    # assets/AssetManifest.bin.json, canvaskit/* and the tree-shaken
    # assets/fonts/MaterialIcons-Regular.otf all keep a stable filename while
    # their bytes change from build to build, so a far-future cache pins a
    # returning browser to an old bundle - and `immutable` stops it even asking
    # for a newer one. Adding a single icon to the UI re-shakes that font under
    # the same name; those browsers would render boxes until the year expired,
    # with nothing fixable from the server side.
    #
    # `wasm` is in this list deliberately: without it canvaskit.wasm falls
    # through to `location /` above and its no-store, and every page load
    # re-downloads 6.9MB.
    location ~* \.(js|css|json|wasm|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|otf)$ {
        access_log off;
        log_not_found off;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin *;
    }

    # AI proctoring assets (web/mediapipe/), fetched only when the rule is on.
    # `^~` so this wins over the regex locations above for every file here.
    # nginx's stock mime.types has no `mjs`, and a module script served as
    # application/octet-stream is refused by the browser, so the detector never
    # loads; `types` replaces the inherited map inside this location only, so
    # it lists every extension served from here. Cached like the rest of the
    # static payload rather than re-downloading ~19 MB per page load.
    #
    # `gzip_static on` HERE ONLY: the Dockerfile writes a .gz beside each file
    # under mediapipe/ (and nowhere else), so a big AI cohort is sent the
    # pre-compressed wasm (11.8 MB -> 3.4 MB) instead of a small pod gzipping
    # it per request, and the .tflite models (no gzip_types entry) compress at
    # all. Without a .gz sibling (a local `make build`) it falls back to the
    # on-the-fly gzip above.
    location ^~ /mediapipe/ {
        gzip_static on;
        types {
            text/javascript js mjs;
            application/wasm wasm;
            application/octet-stream tflite;
        }
        access_log off;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin *;
    }

    # Manifest and service worker (important for Flutter web)
    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin *;
    }

    # Builds pass --pwa-strategy=none so nothing registers this, and
    # web/index.html unregisters anything an older build left behind. Kept
    # no-store so a browser can never reuse a cached copy of the old one.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin *;
    }
}
