# The exam app (Assessment v2's Flutter front end, vendored) and, on the same origin, the API it talks to.
# Same origin is the point: the bundle is built with API_BASE_URL=same-origin, so there is no CORS to configure and
# the bearer never crosses origins. ${ODOO_UPSTREAM} is filled in at start by the image's envsubst step
# (NGINX_ENVSUBST_OUTPUT_DIR=/tmp/assess-nginx, so a read-only root filesystem works).
# Security headers live in /tmp/assess-config/headers.conf, rendered at start (docker/18-assess-config.sh); nginx
# drops server-level add_header lines in a location that sets its own, so every location includes it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json application/wasm image/svg+xml
               font/ttf font/otf application/manifest+json;

    # Routes this deployment never serves. Identity is Yantra's (Keycloak): nobody signs up, applies, or sets or
    # resets an Odoo password through this app. 404, the same answer as a route that does not exist.
    location ~ ^/api/v1/(job/apply|auth_token|forgot_password|reset_password|change_users_password|update_profile_information|get_menu_list|auth/forgot_password|auth/reset_password|auth/password)(/|$) {
        include /tmp/assess-config/headers.conf;
        default_type application/json;
        return 404 '{"ok": false, "error": {"code": "not_found", "message": "Not served here"}}';
    }

    # Assessment v2's API, its media and Odoo's attachment route, proxied to Odoo. Uploads go to object storage
    # by presigned POST; what still comes through here (CSV and form imports) is capped at 50 MB.
    location ~ ^/(api/|assessments_be/|web/content/) {
        proxy_pass http://${ODOO_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
        include /tmp/assess-config/headers.conf;
    }

    # Flutter does not content-hash its scripts or manifests, so they revalidate on every load (an ETag 304).
    location ~* \.(js|mjs|json|wasm)$ {
        add_header Cache-Control "no-cache";
        include /tmp/assess-config/headers.conf;
        try_files $uri =404;
    }

    # The self-hosted AI proctoring runtime (wasm and models), pre-compressed at build time.
    location ^~ /mediapipe/ {
        gzip_static on;
        types {
            text/javascript js mjs;
            application/wasm wasm;
            application/octet-stream tflite task binarypb;
        }
        add_header Cache-Control "no-cache";
        include /tmp/assess-config/headers.conf;
        try_files $uri =404;
    }

    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=86400";
        include /tmp/assess-config/headers.conf;
        try_files $uri =404;
    }

    # Everything else is the single-page app: /exam/<token>, /yantra/launch, /assessments/... all get index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /tmp/assess-config/headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
