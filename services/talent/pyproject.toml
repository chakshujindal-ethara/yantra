[project]
name = "yantra-talent"
version = "0.1.0"
description = "talent: listings, applications and offers, the onboarding checklist, the worker eligibility event."
requires-python = ">=3.12,<3.13"
dependencies = [
  "yantra-common",
  "yantra-contracts",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "fastapi==0.115.5",
  "pydantic==2.14.3",
]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yantra_talent"]
