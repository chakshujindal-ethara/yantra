[project]
name = "yantra-market"
version = "0.1.0"
description = "market: client projects, batches, work units, claims with SKIP LOCKED, submissions, price cards."
requires-python = ">=3.12,<3.13"
dependencies = [
  "yantra-common",
  "yantra-contracts",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "fastapi==0.115.5",
  "pydantic==2.14.3",
  "jsonschema==4.23.0",
]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yantra_market"]
