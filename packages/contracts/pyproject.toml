[project]
name = "yantra-contracts"
version = "0.1.0"
description = "Event schemas and API contracts shared by every Yantra service and the app."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.9.2"]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yantra_contracts"]
