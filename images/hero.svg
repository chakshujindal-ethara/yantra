<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Yantrini, Goddess of the Instrument: hero art for Yantra">
  <title>Yantrini, Goddess of the Instrument</title>
  <desc>The elected mascot of Yantra: a four-armed goddess seated within a Sri Yantra mandala. Her upper hands hold a forged gear and calipers for the onsite workforce; her lower right hand weaves a lattice of light to two hundred thousand distant points, the online workforce; her lower left hand rests on the open ledger, Odoo, the system of record. Nine attendant sigils orbit the ring, one for each service.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b2b"/>
      <stop offset="0.45" stop-color="#141c56"/>
      <stop offset="0.78" stop-color="#1a237e"/>
      <stop offset="1" stop-color="#00251f"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.42" r="0.52">
      <stop offset="0" stop-color="#fbc02d" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#f9a825" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fbc02d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e1" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fbc02d" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fbc02d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#2c387e"/>
      <stop offset="0.55" stop-color="#141c56"/>
      <stop offset="1" stop-color="#0b1140"/>
    </linearGradient>
    <linearGradient id="sari" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#00897b"/>
      <stop offset="1" stop-color="#004d43"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbc02d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbc02d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00332e"/>
      <stop offset="1" stop-color="#001a17"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00897b"/>
      <stop offset="0.5" stop-color="#26a69a"/>
      <stop offset="1" stop-color="#fbc02d"/>
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e1"/>
      <stop offset="0.6" stop-color="#fbc02d"/>
      <stop offset="1" stop-color="#fbc02d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

