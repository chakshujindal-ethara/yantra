# Staging follows main: a merged promotion PR (new digests in values-staging.yaml) deploys within minutes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yantra-staging
  namespace: argocd
spec:
  project: yantra
  source:
    repoURL: https://github.com/EtharaLabs/yantra
    targetRevision: main
    path: deployment/helm/yantra
    helm:
      releaseName: yantra
      valueFiles: [values.yaml, values-staging.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: yantra-staging
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
