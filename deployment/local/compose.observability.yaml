# Observability overlay for the local rig: Prometheus (alert rules loaded), Grafana with the Yantra overview
# dashboard (anonymous viewer, http://localhost:3000), and a Postgres exporter for the connection alert.
#   docker compose -f deployment/local/compose.yaml -f deployment/local/compose.observability.yaml up -d
# Logs: every process can print JSON (LOG_FORMAT=json); `docker compose logs <svc> | jq` reads them here, and a
# cluster's log stack (Loki or another) ships the same stdout. No log store runs on the rig.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [gateway, work, money, work-events, money-events]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin   # local rig only
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://yantra:yantra@postgres:5432/yantra?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
