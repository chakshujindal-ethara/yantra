# Prometheus for the local rig (deployment/local/compose.observability.yaml). In a cluster the Prometheus operator
# scrapes the same /metrics through the chart's ServiceMonitors (monitoring.serviceMonitor: true) and loads
# alerts.yaml as a PrometheusRule.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8090"]}]
  - job_name: work
    static_configs: [{targets: ["work:8081"]}]
  - job_name: work-events
    static_configs: [{targets: ["work-events:8085"]}]
  - job_name: money
    static_configs: [{targets: ["money:8082"]}]
  - job_name: money-events
    static_configs: [{targets: ["money-events:8086"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
