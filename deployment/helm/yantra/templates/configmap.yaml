apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yantra.fullname" . }}-config
  labels:
    {{- include "yantra.labels" . | nindent 4 }}
data:
  YANTRA_ENV: {{ .Values.env | quote }}
  {{- if and (ne .Values.env "local") (not .Values.config.FORWARDED_ALLOW_IPS) }}
  {{- fail (printf "env=%s needs config.FORWARDED_ALLOW_IPS (the ingress controller's pod CIDR): without it every client shares the ingress pod's address and one rate limit" .Values.env) }}
  {{- end }}
  YANTRA_RELEASE: {{ include "yantra.release" . | quote }}
  {{- range $k, $v := .Values.config }}
  {{- if ne (toString $v) "" }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
  {{- end }}
