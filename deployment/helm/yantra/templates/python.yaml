{{- /* One Deployment + Service (+ HPA, PDB, ServiceMonitor) per enabled entry of .Values.python. */ -}}
{{- $root := . }}
{{- $full := include "yantra.fullname" . }}
{{- if and .Values.python.gateway.enabled (not .Values.python.gateway.env.YANTRA_GATEWAY_KEYCLOAK_ISSUER) }}
{{- fail "python.gateway.env.YANTRA_GATEWAY_KEYCLOAK_ISSUER is required (https://<keycloak>/realms/yantra)" }}
{{- end }}
{{- range $name, $p := .Values.python }}
{{- if $p.enabled }}
{{- $sel := dict "root" $root "component" $p.component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-{{ $name }}
  labels:
    {{- include "yantra.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $p.component }}
spec:
  {{- if not (and $p.hpa $p.hpa.enabled) }}
  {{- /* with an HPA the replica count is the HPA's: rendering it would make Argo CD fight every scale */}}
  replicas: {{ $p.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "yantra.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yantra.baseLabels" $root | nindent 8 }}
        {{- include "yantra.selector" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ $full }}
      automountServiceAccountToken: false
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "yantra.image" (dict "img" $root.Values.image.python) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command:
            {{- toYaml $p.command | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $p.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $full }}-config
          env:
            {{- include "yantra.plainEnv" $p.env | nindent 12 }}
            {{- if eq $name "gateway" }}
            - name: YANTRA_GATEWAY_WORK_URL
              value: {{ printf "http://%s-work-api:%v" $full (index $root.Values.python "work-api" "port") | quote }}
            - name: YANTRA_GATEWAY_MONEY_URL
              value: {{ printf "http://%s-money-api:%v" $full (index $root.Values.python "money-api" "port") | quote }}
            {{- end }}
            {{- if and $root.Values.assess.enabled (has $name (list "work-api" "work-events")) }}
            {{- include "yantra.assessWorkEnv" $root | nindent 12 }}
            {{- end }}
            {{- include "yantra.secretEnv" (dict "root" $root "map" (merge (dict) $p.secretEnv $root.Values.commonSecretEnv)) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ $p.probes.liveness }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: {{ $p.probes.readiness }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-{{ $name }}
  labels:
    {{- include "yantra.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $p.component }}
spec:
  type: ClusterIP
  selector:
    {{- include "yantra.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ $p.port }}
      targetPort: http
      protocol: TCP
{{- if and $p.hpa $p.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $full }}-{{ $name }}
  labels:
    {{- include "yantra.labels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $full }}-{{ $name }}
  minReplicas: {{ $p.hpa.minReplicas }}
  maxReplicas: {{ $p.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $p.hpa.cpu }}
{{- end }}
{{- if and $p.pdb $p.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-{{ $name }}
  labels:
    {{- include "yantra.labels" $root | nindent 4 }}
spec:
  minAvailable: {{ $p.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "yantra.selector" $sel | nindent 6 }}
{{- end }}
{{- if and $root.Values.monitoring.serviceMonitor $p.metrics }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $full }}-{{ $name }}
  labels:
    {{- include "yantra.labels" $root | nindent 4 }}
    {{- with $root.Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "yantra.selector" $sel | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $root.Values.monitoring.interval }}
{{- end }}
{{- end }}
{{- end }}
