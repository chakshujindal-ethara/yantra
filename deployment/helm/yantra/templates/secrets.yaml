{{- /*
One Secret per key, named <release>-<key>, data key `value`.
Plain Secrets only for env=local; staging and prod must read the store through External Secrets.
*/ -}}
{{- if and (ne .Values.env "local") (not .Values.secrets.external) }}
{{- fail (printf "env=%s needs secrets.external=true: plain Secrets from values are for the local rig only" .Values.env) }}
{{- end }}
{{- if and .Values.secrets.external (not .Values.secrets.storeRef.name) }}
{{- fail "secrets.external=true needs secrets.storeRef.name (the ClusterSecretStore)" }}
{{- end }}
{{- range (include "yantra.secretKeys" . | fromYamlArray) }}
{{- $name := include "yantra.secretName" (dict "root" $ "key" .name) }}
{{- if $.Values.secrets.external }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "yantra.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.secrets.storeRef.kind }}
    name: {{ $.Values.secrets.storeRef.name }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        key: {{ printf "%s/%s" $.Values.secrets.remotePrefix .name }}
{{- else }}
{{- $value := index $.Values.secrets.values .name }}
{{- if $value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "yantra.labels" $ | nindent 4 }}
type: Opaque
stringData:
  value: {{ $value | quote }}
{{- else if not .optional }}
{{- fail (printf "secrets.values.%s is required (env=local)" .name) }}
{{- end }}
{{- end }}
{{- end }}
