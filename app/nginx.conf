server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers live in /tmp/yantra-config/headers.conf, rendered at start (docker/40-yantra-config.sh).
    # nginx drops server-level add_header lines in a location that sets its own, so every location includes it.
    index index.html;

    # The bundle is large text (main.dart.js, JSON manifests, the wasm runtime): compress it on the way out.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml font/ttf
               application/octet-stream application/manifest+json;

    # Flutter does not content-hash main.dart.js, the bootstrap, the service worker or the manifests, so they
    # must revalidate on every load (ETag makes that a 304 when nothing changed).
    location ~* \.(js|json|wasm)$ {
        add_header Cache-Control "no-cache";
        include /tmp/yantra-config/headers.conf;
        try_files $uri =404;
    }

    # Fonts and icons revalidate too: the build tree-shakes MaterialIcons-Regular.otf down to the glyphs the
    # code uses, so its content changes with every release while its URL does not. A week-long cache served a
    # stale font and every newly used icon rendered blank. ETag keeps the check a cheap 304.
    location ~* ^/(assets/(assets/)?fonts|icons)/ {
        add_header Cache-Control "no-cache";
        include /tmp/yantra-config/headers.conf;
        try_files $uri =404;
    }

    # The CanvasKit runtime is versioned by the Flutter release and is large: a day is safe.
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=86400";
        include /tmp/yantra-config/headers.conf;
        try_files $uri =404;
    }

    # The runtime config the entrypoint renders from the environment (docker/40-yantra-config.sh). It lives under
    # /tmp so a read-only root filesystem still works; when absent the app uses the values built into it.
    location = /config.json {
        alias /tmp/yantra-config/config.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        include /tmp/yantra-config/headers.conf;
    }

    # The shell page itself is never cached, or a deploy would be invisible until the cache expired.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /tmp/yantra-config/headers.conf;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /tmp/yantra-config/headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
