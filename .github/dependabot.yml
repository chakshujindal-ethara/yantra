# Weekly version bumps for the pinned actions, base images and Python dependencies. Each bump is a PR that CI
# checks like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: ["/", "/app", "/services/odoo"]
    schedule: {interval: weekly}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
